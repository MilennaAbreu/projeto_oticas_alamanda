<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Otica Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <button class="toggle">&#9776;</button>
        <ul class="menu">
            <li class="title">Cadastros</li>
            <li><a href="#" data-page="produtos">Produtos</a></li>
            <li><a href="#" data-page="clientes">Clientes</a></li>
        </ul>
    </aside>
    <main id="content">
        <section id="home" class="page active">
            <h1>Bem-vindo</h1>
            <p>Selecione um item no menu.</p>
        </section>
        <section id="produtos" class="page">
            <h1>Produtos</h1>
            <button id="novo-produto">Novo</button>
            <table id="lista-produtos">
                <thead><tr><th>ID</th><th>Nome</th><th>Valor</th><th>Estoque</th><th>Ações</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="produto-form" class="page">
            <h1>Novo Produto</h1>
            <form id="form-produto">
                <input type="hidden" name="id" />
                <div><input name="nome" placeholder="Nome" required></div>
                <div><input name="id_tipo" placeholder="ID Tipo" type="number"></div>
                <div><input name="id_categoria" placeholder="ID Categoria" type="number"></div>
                <div><input name="marca" placeholder="Marca"></div>
                <div><input name="codigo" placeholder="Código"></div>
                <div><input name="unidade_medida" placeholder="Unidade" value="UN"></div>
                <div><input name="valor_unitario" placeholder="Valor" type="number" step="0.01"></div>
                <div><input name="estoque_atual" placeholder="Estoque" type="number"></div>
                <div>
                    <select name="status">
                        <option value="ATIVO">ATIVO</option>
                        <option value="INATIVO">INATIVO</option>
                    </select>
                </div>
                <div>
                    <button type="submit">Salvar</button>
                    <button type="button" id="cancelar-produto">Cancelar</button>
                </div>
            </form>
        </section>
        <section id="clientes" class="page">
            <h1>Clientes</h1>
            <form id="form-cliente">
                <input type="hidden" name="id" />
                <div><input name="nome" placeholder="Nome" required></div>
                <div><input name="cpf" placeholder="CPF" required></div>
                <div><input name="contato" placeholder="Contato"></div>
                <div><button type="submit">Salvar</button></div>
            </form>
            <table id="lista-clientes">
                <thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Contato</th><th>Ações</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
    </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
